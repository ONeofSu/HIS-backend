    networks:
      - his-network
    deploy:
      resources:
        limits:
          cpus: '0.5' # 限制只使用0.5个CPU核
          memory: 512M # 限制容器最大只能用512MB内存
        reservations:
          memory: 256M # 保证最少给256M内存

  # -------------------------------------------------------
  # 9. 研究服务 (Research)
  # -------------------------------------------------------
  his-research:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: Research/target/*.jar
    container_name: herb-research-service
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_DATASOURCE_URL=jdbc:mysql://his-mysql:3306/his_research?useUnicode=true&characterEncoding=utf-8
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://his-eureka:8080/eureka/
    depends_on:
      - his-eureka
    networks:
      - his-network
    deploy:
      resources:
        limits:
          cpus: '0.5' # 限制只使用0.5个CPU核
          memory: 512M # 限制容器最大只能用512MB内存
        reservations:
          memory: 256M # 保证最少给256M内存

  # -------------------------------------------------------
  # 10. 评价与申报 (EvaluationAndDeclaration)
  # -------------------------------------------------------
  his-evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: EvaluationAndDeclaration/target/*.jar
    container_name: evaluation-service
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - SPRING_DATASOURCE_URL=jdbc:mysql://his-mysql:3306/his_herb_rating?useUnicode=true&characterEncoding=utf-8
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://his-eureka:8080/eureka/
    depends_on:
      - his-eureka
    networks:
      - his-network
    deploy:
      resources:
        limits:
          cpus: '0.5' # 限制只使用0.5个CPU核
          memory: 512M # 限制容器最大只能用512MB内存
        reservations:
          memory: 256M # 保证最少给256M内存

# 声明使用已存在的网络 (由 docker-compose-infra.yml 创建)
networks:
  his-network:
    external: true